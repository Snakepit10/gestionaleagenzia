<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Ledwall Calcio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@500&display=swap" rel="stylesheet">
<style>
  /* Auto-adattamento a QUALSIASI risoluzione del ledwall (una pagina sola, nessuna config).
     --w / --ph = larghezza / altezza REALI del dispositivo: riempiono lo schermo.
     --h        = base di SCALA per testi ed elementi. Usa vmin:
                  in orizzontale (320x200, 320x160, ...) vmin == altezza => resa IDENTICA a prima;
                  in verticale (es. 384x960) vmin == lato corto => i testi non escono di lato.
     Anteprima da PC/telefono o player che non riporta la risoluzione: aggiungere ?w=320&h=200
     all'URL (gestito nello <script>); sul ledwall reale, senza parametri, riempie lo schermo. */
  :root{--w:100vw; --ph:100vh; --h:100vmin;}
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:var(--w);height:var(--ph);overflow:hidden;background:#000;}
  body{font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif;color:#fff;
       -webkit-font-smoothing:none;text-rendering:optimizeSpeed;}
  #tk{width:var(--w);height:var(--ph);display:flex;flex-direction:column;overflow:hidden;position:relative;
      background:linear-gradient(160deg,#123a5a 0%,#0b2236 45%,#06121d 100%);}
  .lane{flex:1;position:relative;overflow:hidden;display:block;}

  /* ---- Scheda partita (una alla volta, stile tabellone) ---- */
  /* Intestazione centrata (competizione + data) sopra, riga logo-punteggio-logo sotto,
     il tutto centrato verticalmente: distribuzione bilanciata. */
  .card{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;
        gap:calc(var(--h) * 0.025);padding:calc(var(--h) * 0.04) 3%;color:#fff;
        opacity:0;transform:translateY(25%);transition:opacity .35s,transform .35s;}
  .card.on{opacity:1;transform:none;}
  .card.out{opacity:0;transform:translateY(-25%);}
  .hdr{display:flex;flex-direction:column;align-items:center;line-height:1;gap:calc(var(--h) * 0.02);}
  /* Riga bandiera + nome campionato */
  .clw{display:flex;align-items:center;justify-content:center;gap:calc(var(--h) * 0.03);max-width:100%;}
  .clw .fl{height:calc(var(--h) * 0.11);width:auto;border-radius:2px;flex:0 0 auto;
           box-shadow:0 0 0 1px rgba(255,255,255,.35);}
  /* Nome campionato: banner giallo, testo scuro, grande e ben visibile */
  .hdr .cl{font-size:calc(var(--h) * 0.135);font-weight:800;color:#111;background:#ffd200;
           padding:0.1em 0.55em;border-radius:0.16em;letter-spacing:0.04em;text-transform:uppercase;
           line-height:1;max-width:96%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
           box-shadow:0 calc(var(--h)*0.01) calc(var(--h)*0.03) rgba(0,0,0,.35);}
  .hdr .dt{font-size:calc(var(--h) * 0.08);color:#cbd6df;font-weight:700;font-variant-numeric:tabular-nums;}
  .row{display:grid;grid-template-columns:1fr 1.15fr 1fr;align-items:center;}
  .team{display:flex;flex-direction:column;align-items:center;gap:0.2em;min-width:0;}
  .badge{width:calc(var(--h) * 0.35);height:calc(var(--h) * 0.35);border-radius:50%;
         background:radial-gradient(circle at 50% 36%, #ffffff 0%, #eef2f7 55%, #c3ced9 100%);
         box-shadow:inset 0 0 0 1px rgba(255,255,255,.6), 0 2px 5px rgba(0,0,0,.3);
         display:flex;align-items:center;justify-content:center;overflow:hidden;}
  /* I loghi di diretta.it sono 30x30: leggero ingrandimento (~1.3x) per renderli piu' grandi. */
  .badge img{width:calc(var(--h) * 0.20);height:calc(var(--h) * 0.20);object-fit:contain;image-rendering:auto;}
  .badge i{font-style:normal;width:100%;height:100%;display:flex;align-items:center;justify-content:center;
           font-size:calc(var(--h) * 0.12);font-weight:800;color:#111;letter-spacing:0.02em;}
  .team .nm{font-size:calc(var(--h) * 0.12);font-weight:700;white-space:nowrap;max-width:100%;
            overflow:hidden;text-overflow:ellipsis;text-align:center;}
  .team .nm.win{color:#ffd200;}
  .mid{display:flex;flex-direction:column;align-items:center;gap:0.02em;text-align:center;}
  .mid .big{font-size:calc(var(--h) * 0.34);font-weight:800;line-height:0.95;white-space:nowrap;
            font-variant-numeric:tabular-nums;letter-spacing:0.02em;}
  .mid .big.time{font-size:calc(var(--h) * 0.24);color:#2b7bff;}
  .mid .stat{font-size:calc(var(--h) * 0.11);font-weight:800;color:#e5202f;letter-spacing:0.05em;}
  .mid .stat.gray{color:#b8c3cc;}
  /* Partita live: badge rosso, testo+minuto bianchi, lampeggiante, ben visibile */
  .mid .live{display:inline-flex;align-items:center;background:#e5202f;color:#fff;font-weight:800;
             font-size:calc(var(--h) * 0.12);line-height:1;padding:0.16em 0.55em;border-radius:0.2em;
             letter-spacing:0.03em;box-shadow:0 0 calc(var(--h)*0.04) rgba(229,32,47,.7);
             animation:blink 1s steps(2,start) infinite;}
  .mid .live.int{animation:none;}

  /* ---- Scheda RIEPILOGO: tabellone (orario | casa - trasferta), diviso per stato ---- */
  /* Stile tabella TV: righe a tutta larghezza con bande alternate, orario a sinistra,
     squadra di casa allineata a destra e trasferta a sinistra del punteggio centrale.
     La font-size di .sumlist e' la BASE di scala (righe/intestazioni in 'em'): fitSummary
     le rimpicciolisce insieme solo quando ci sono troppe partite per entrare. */
  .card.sum{justify-content:flex-start;gap:0;padding:0;}
  .card.sum .hdr{flex:0 0 auto;padding:calc(var(--h) * 0.04) 0 calc(var(--h) * 0.03);}
  .sumlist{flex:1;width:100%;display:flex;flex-direction:column;justify-content:center;
           overflow:hidden;font-size:calc(var(--h) * 0.088);}
  .sgh{font-size:0.58em;font-weight:800;letter-spacing:0.09em;text-transform:uppercase;
       text-align:left;line-height:1;padding:0.34em 4% 0.14em;}
  .sgh.fin{color:#c3ced9;} .sgh.live{color:#ff6670;} .sgh.sched{color:#9fc0ff;}
  .sr{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:0.55em;
      font-weight:700;line-height:1.05;padding:0.22em 4%;}
  .sr.alt{background:rgba(255,255,255,.06);}
  .sr .sh{text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .sr .sa{text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .sr .sc{font-weight:800;font-variant-numeric:tabular-nums;min-width:2.5em;text-align:center;
          background:#0b1e2c;color:#fff;padding:0.04em 0.4em;border-radius:0.16em;}
  .sr .sc.live{color:#ff5b66;box-shadow:0 0 0 1px rgba(255,91,102,.55);}
  .sr .sc.sched{background:transparent;color:#9fc0ff;box-shadow:none;font-weight:800;}
  .sr .win{color:#ffd200;}
  /* Con loghi ai lati: colonne logo-casa-punteggio-trasferta-logo */
  .sr.lg{grid-template-columns:1.5em 1fr auto 1fr 1.5em;gap:0.4em;}
  .sr .slg{width:1.5em;height:1.5em;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
  .sr .slg img{max-width:100%;max-height:100%;object-fit:contain;}
  /* Indicatore pagina (1/2) quando il riepilogo e' diviso su piu' schede */
  .spage{font-size:calc(var(--h) * 0.075);font-weight:800;color:#0b1e2c;background:#ffd200;
         border-radius:0.2em;padding:0.05em 0.35em;margin-left:0.3em;line-height:1;}

  /* ---- Intermezzo pubblicitario: risultati in basso, immagine sopra ---- */
  .ad{position:absolute;left:0;right:0;top:0;bottom:calc(var(--h) * 0.24);overflow:hidden;background:#000;
      transform:translateY(-105%);transition:transform .45s cubic-bezier(.2,.8,.2,1);}
  .ad.on{transform:none;}
  .ad .sl{position:absolute;inset:0;background-size:cover;background-position:center;background-repeat:no-repeat;
          opacity:0;transition:opacity .5s,transform .5s cubic-bezier(.2,.8,.2,1);}
  /* stato iniziale (entrata) di ciascun effetto */
  .ad .sl.fx-right{transform:translateX(60%);}
  .ad .sl.fx-zoom{transform:scale(0.6);}
  .ad .sl.fx-up{transform:translateY(60%);}
  .ad .sl.fx-fade{transform:none;}
  /* stato attivo: immagine CENTRATA (deve venire DOPO gli stati iniziali per vincere) */
  .ad .sl.on{opacity:1;transform:none;}
  /* stato di uscita */
  .ad .sl.fx-right.out{transform:translateX(-60%);opacity:0;}
  .ad .sl.fx-zoom.out{transform:scale(1.3);opacity:0;}
  .ad .sl.fx-up.out{transform:translateY(-60%);opacity:0;}
  .ad .sl.fx-fade.out{transform:none;opacity:0;}
  .bar{position:absolute;left:0;right:0;bottom:0;height:calc(var(--h) * 0.24);display:flex;align-items:center;
       overflow:hidden;background:#0b1e2c;border-top:0.1em solid #ffd200;color:#fff;
       font-size:calc(var(--h) * 0.11);font-weight:700;white-space:nowrap;
       transform:translateY(105%);transition:transform .45s cubic-bezier(.2,.8,.2,1);}
  .bar.on{transform:none;}
  .bar .trk{display:inline-flex;align-items:center;gap:0.9em;will-change:transform;
            animation:barscroll linear infinite;}
  @keyframes barscroll{from{transform:translateX(0);}to{transform:translateX(-50%);}}
  .bar .it{display:inline-flex;align-items:center;gap:0.3em;}
  .bar .bs{background:#fff;color:#000;padding:0 0.3em;border-radius:0.12em;font-weight:800;font-variant-numeric:tabular-nums;}
  .bar .bt{background:#2b7bff;color:#fff;padding:0 0.3em;border-radius:0.12em;font-weight:800;font-variant-numeric:tabular-nums;}
  .bar .bl{background:#e5202f;color:#fff;font-weight:800;font-size:0.78em;padding:0 0.32em;
           border-radius:0.12em;animation:blink 1.2s steps(2,start) infinite;}
  .bar .bc{color:#ffd200;font-size:0.85em;font-weight:800;letter-spacing:.02em;display:inline-flex;align-items:center;gap:0.35em;}
  .bar .bc .bfl{height:0.95em;width:auto;border-radius:1px;box-shadow:0 0 0 1px rgba(255,255,255,.3);}
  .bar .bsep{color:#ffd200;font-weight:800;opacity:.85;}

  @keyframes blink{to{opacity:0.45;}}

  /* Ledwall VERTICALE (la classe .portrait la mette lo <script> quando il box e' piu' alto che
     largo, sia sul device reale sia in anteprima con ?w=&h=). La riga orizzontale
     logo-punteggio-logo sarebbe troppo stretta: sfruttiamo l'altezza IMPILANDO in verticale
     (squadra casa / punteggio / squadra ospite), ognuno a tutta larghezza (niente sforamenti,
     punteggi e orari sempre leggibili). Alziamo anche pubblicita' + barra (restano allineate). */
  .portrait .card{gap:calc(var(--h) * 0.05);}
  .portrait .row{display:flex;flex-direction:column;align-items:center;gap:calc(var(--h) * 0.045);}
  .portrait .team{flex-direction:row;justify-content:center;gap:0.5em;max-width:92%;}
  .portrait .badge{width:calc(var(--h) * 0.24);height:calc(var(--h) * 0.24);}
  .portrait .badge img{width:calc(var(--h) * 0.15);height:calc(var(--h) * 0.15);}
  .portrait .team .nm{font-size:calc(var(--h) * 0.12);}
  .portrait .mid .big{font-size:calc(var(--h) * 0.34);}
  .portrait .mid .big.time{font-size:calc(var(--h) * 0.26);}
  .portrait .ad{bottom:calc(var(--h) * 0.22);}
  .portrait .bar{height:calc(var(--h) * 0.22);}

  /* Meta: ora ultimo aggiornamento */
  #foot{position:absolute;right:3px;bottom:1px;z-index:6;font-size:12px;color:#3a4a55;font-weight:600;}
  #foot.stale{color:#e5202f;}
</style>
</head>
<body>
<div id="tk"><div class="lane" id="lane"></div><div id="foot"></div></div>

<script>
(function(){
  "use strict";
  var qs = new URLSearchParams(location.search);
  var DEMO = qs.get('demo') ? ('?demo=' + qs.get('demo')) : '';

  // Override risoluzione: ?w=320&h=200 forza un riquadro di quelle dimensioni (anteprima da PC/
  // telefono, o player che non riporta la risoluzione nativa). Senza parametri riempie lo schermo.
  var FORCE_W = parseInt(qs.get('w'), 10), FORCE_H = parseInt(qs.get('h'), 10);
  var FORCED = (FORCE_W>0 && FORCE_H>0);
  if(FORCED){
    var r = document.documentElement.style;
    r.setProperty('--w',  FORCE_W + 'px');
    r.setProperty('--ph', FORCE_H + 'px');
    r.setProperty('--h',  Math.min(FORCE_W, FORCE_H) + 'px');   // base di scala = lato corto
    var b = document.body.style;                                 // centra il riquadro nella finestra
    b.width='100vw'; b.height='100vh'; b.display='flex';
    b.alignItems='center'; b.justifyContent='center';
  }
  // Layout verticale quando il box e' piu' alto che largo. Basato sull'aspect ratio EFFETTIVO
  // del box (device reale via viewport, o override), non sull'orientamento della finestra:
  // cosi' funziona sia sul ledwall sia in anteprima. Rivalutato a ogni resize/rotazione.
  function applyOrientation(){
    var w = FORCED ? FORCE_W : window.innerWidth;
    var h = FORCED ? FORCE_H : window.innerHeight;
    document.documentElement.classList.toggle('portrait', h > w);
  }
  applyOrientation();
  window.addEventListener('resize', applyOrientation);
  window.addEventListener('orientationchange', applyOrientation);
  // Override facoltativi via query (per test); la configurazione vera sta nel backend admin.
  var Q = {
    hold:    parseFloat(qs.get('hold'))    || null,
    adEvery: parseInt(qs.get('adEvery'))   || null,
    adSlide: parseFloat(qs.get('adSlide')) || null,
    barDur:  parseFloat(qs.get('barDur'))  || null,
    sumMax:  parseInt(qs.get('sumMax'))    || null,
    sumLogos: qs.get('sumLogos')                            // '1'/'0' o null
  };

  var lane = document.getElementById('lane');
  var foot = document.getElementById('foot');
  var esc = function(s){ return String(s==null?'':s)
     .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); };

  var LIST = [];    // partite appiattite (per la barra risultati): {c, flag, m}
  var SEQ  = [];    // sequenza schede da mostrare: {kind:'match'|'summary', ...}
  var ADS  = [];    // {url, fx, seconds}
  var CFG  = {hold:5, adEvery:4, adSlide:5, barDur:24, sumMax:6, sumLogos:false};   // impostazioni dal backend (default di sicurezza)
  var i = 0, cur = null, shown = 0, started = false;
  var barOffset = 0;         // secondi di scorrimento risultati accumulati (per riprendere)

  function applyCfg(c){
    c = c || {};
    CFG.hold    = Q.hold    || c.hold    || 5;
    CFG.adEvery = Q.adEvery || c.adEvery || 4;
    CFG.adSlide = Q.adSlide || c.adSlide || 5;
    CFG.barDur  = Q.barDur  || c.barDur  || 24;
    CFG.sumMax  = Q.sumMax  || c.sumMax  || 6;
    CFG.sumLogos = (Q.sumLogos!=null) ? (Q.sumLogos==='1'||Q.sumLogos==='true')
                                      : !!c.sumLogos;
  }

  function order(st){ return st==='live'?0 : st==='scheduled'?1 : 2; }
  function flatten(data){
    var out = [];
    (data.competitions||[]).forEach(function(c){
      (c.matches||[]).slice().sort(function(a,b){return order(a.status)-order(b.status);})
        .forEach(function(m){ out.push({c:c.shortName||c.name, flag:c.flag||null, mode:c.mode||'entrambe', m:m}); });
    });
    return out;
  }
  // Sequenza schede in base alla MODALITA' di ogni competizione (impostata dall'admin):
  //  - 'entrambe' : le singole schede partita, poi (se >= 2 partite) la scheda RIEPILOGO;
  //  - 'schede'   : solo le singole schede partita;
  //  - 'riepilogo': solo la scheda RIEPILOGO (anche con 1 sola partita).
  // LIST e' gia' raggruppata per competizione (nell'ordine del feed).
  function buildSequence(list){
    var groups=[], cur=null;
    for(var j=0;j<list.length;j++){
      var it=list[j];
      if(!cur || it.c!==cur.c){ cur={c:it.c, flag:it.flag, mode:it.mode||'entrambe', matches:[]}; groups.push(cur); }
      cur.matches.push(it.m);
    }
    var seq=[];
    groups.forEach(function(g){
      var showCards   = (g.mode!=='riepilogo');
      var showSummary = (g.mode==='riepilogo') || (g.mode==='entrambe' && g.matches.length>=2);
      if(showCards){ g.matches.forEach(function(m){ seq.push({kind:'match', c:g.c, flag:g.flag, m:m}); }); }
      if(showSummary){
        // ordina per stato e spezza in piu' schede (max CFG.sumMax) per restare leggibile
        var ordered=[];
        SUM_SECTIONS.forEach(function(sec){
          ordered=ordered.concat(g.matches.filter(function(m){return m.status===sec.k;}));
        });
        var per=Math.max(1, CFG.sumMax||6), pages=Math.ceil(ordered.length/per)||1;
        for(var pi=0; pi<ordered.length; pi+=per){
          seq.push({kind:'summary', c:g.c, flag:g.flag, matches:ordered.slice(pi, pi+per),
                    page:(pi/per)+1, pages:pages});
        }
      }
    });
    return seq;
  }
  function initials(n){
    return (n||'').split(/\s+/).map(function(w){return w[0]||'';}).join('').slice(0,3).toUpperCase();
  }
  function badge(name, logo){
    if(logo){
      return '<span class="badge"><img src="'+esc(logo)+'" alt="" '+
             'onerror="this.parentNode.innerHTML=\'<i>'+esc(initials(name))+'</i>\'"></span>';
    }
    return '<span class="badge"><i>'+esc(initials(name))+'</i></span>';
  }
  function team(name, logo, win){
    return '<div class="team">'+badge(name,logo)+
           '<span class="nm'+(win?' win':'')+'">'+esc(name)+'</span></div>';
  }
  function todayStr(){ return new Date().toLocaleDateString('it-IT',{day:'2-digit',month:'2-digit',year:'numeric'}); }
  function isMin(m){ return /^\d+$/.test(m); }
  function barLive(m){ if(m==='INT') return 'INT'; if(isMin(m)) return "LIVE "+m+"'"; return 'LIVE'; }

  function card(it){
    var m=it.m, hw=false, aw=false, big, stat;
    if(m.status==='live'){
      var isInt = (m.minute==='INT');
      var txt = isInt ? 'INTERVALLO' : (isMin(m.minute) ? ('LIVE '+m.minute+"'") : 'LIVE');
      big='<span class="big">'+(m.homeScore==null?0:m.homeScore)+'-'+(m.awayScore==null?0:m.awayScore)+'</span>';
      stat='<span class="live'+(isInt?' int':'')+'">'+txt+'</span>';
    } else if(m.status==='scheduled'){
      big='<span class="big time">'+esc(m.time||'')+'</span>';
      stat='<span class="stat gray">'+(m.date?'DOMANI':'OGGI')+'</span>';
    } else {
      hw = (m.homeScore!=null && m.awayScore!=null && m.homeScore>m.awayScore);
      aw = (m.homeScore!=null && m.awayScore!=null && m.awayScore>m.homeScore);
      big='<span class="big">'+(m.homeScore==null?'-':m.homeScore)+'-'+(m.awayScore==null?'-':m.awayScore)+'</span>';
      stat='<span class="stat">FINALE</span>';
    }
    var fl = it.flag ? '<img class="fl" src="'+esc(it.flag)+'" alt="" onerror="this.remove()">' : '';
    var hdr='<div class="hdr"><div class="clw">'+fl+'<span class="cl">'+esc(it.c)+'</span></div>'+
            '<span class="dt">'+esc(m.date||todayStr())+'</span></div>';
    var row='<div class="row">'+team(m.home,m.homeLogo,hw)+'<div class="mid">'+big+stat+'</div>'+team(m.away,m.awayLogo,aw)+'</div>';
    var el=document.createElement('div'); el.className='card';
    el.innerHTML = hdr+row;
    return el;
  }
  function fit(el){
    el.querySelectorAll('.nm').forEach(function(nm){
      var fs=parseFloat(getComputedStyle(nm).fontSize), n=0;
      while(nm.scrollWidth>nm.clientWidth && n<12){ fs*=0.9; nm.style.fontSize=fs+'px'; n++; }
    });
  }
  // Cella logo (mantiene lo spazio anche se manca il logo, per allineare la griglia).
  function slg(url){ return '<span class="slg">'+(url?'<img src="'+esc(url)+'" alt="" onerror="this.remove()">':'')+'</span>'; }
  // Riga tabellone: [logo] [casa a destra] [punteggio/orario] [trasferta a sinistra] [logo].
  function sumRow(m, alt, logos){
    var hw=(m.homeScore!=null&&m.awayScore!=null&&m.homeScore>m.awayScore);
    var aw=(m.homeScore!=null&&m.awayScore!=null&&m.awayScore>m.homeScore);
    var mid;
    if(m.status==='scheduled'){ mid='<span class="sc sched">'+esc(m.time||'')+'</span>'; }
    else {
      var cls='sc'+(m.status==='live'?' live':'');
      var hs=(m.homeScore==null?(m.status==='live'?0:'-'):m.homeScore);
      var as=(m.awayScore==null?(m.status==='live'?0:'-'):m.awayScore);
      mid='<span class="'+cls+'">'+hs+'-'+as+'</span>';
    }
    var hl=logos?slg(m.homeLogo):'', al=logos?slg(m.awayLogo):'';
    return '<div class="sr'+(logos?' lg':'')+(alt?' alt':'')+'">'+hl+
           '<span class="sh'+(hw?' win':'')+'">'+esc(m.home)+'</span>'+mid+
           '<span class="sa'+(aw?' win':'')+'">'+esc(m.away)+'</span>'+al+'</div>';
  }
  // Riepilogo diviso per stato, in ordine cronologico: Terminate -> In corso -> Prossime.
  var SUM_SECTIONS=[{k:'finished',cls:'fin',label:'Terminate'},
                    {k:'live',cls:'live',label:'In corso'},
                    {k:'scheduled',cls:'sched',label:'Prossime'}];
  function summaryCard(it){
    var fl = it.flag ? '<img class="fl" src="'+esc(it.flag)+'" alt="" onerror="this.remove()">' : '';
    var logos=!!CFG.sumLogos, body='', ri=0;
    SUM_SECTIONS.forEach(function(sec){
      var ms=it.matches.filter(function(m){return m.status===sec.k;});
      if(!ms.length) return;
      body+='<div class="sgrp"><div class="sgh '+sec.cls+'">'+sec.label+'</div>'+
            ms.map(function(m){ return sumRow(m, (ri++)%2===1, logos); }).join('')+'</div>';
    });
    var pg=(it.pages>1)?'<span class="spage">'+it.page+'/'+it.pages+'</span>':'';
    var el=document.createElement('div'); el.className='card sum';
    el.innerHTML='<div class="hdr"><div class="clw">'+fl+'<span class="cl">'+esc(it.c)+'</span>'+pg+'</div></div>'+
                 '<div class="sumlist">'+body+'</div>';
    return el;
  }
  // Scala tutto l'elenco (righe + intestazioni, in em) finche' entra in altezza, solo se serve.
  function fitSummary(el){
    var list=el.querySelector('.sumlist'); if(!list) return;
    var base=parseFloat(getComputedStyle(list).fontSize), n=0;
    while(list.scrollHeight>list.clientHeight+1 && n<18){
      base*=0.94; list.style.fontSize=base+'px'; n++;
    }
  }
  function barItem(it){
    var m=it.m, s;
    if(m.status==='live') s='<span class="bl">'+barLive(m.minute)+'</span><span>'+esc(m.home)+
        '</span><span class="bs">'+(m.homeScore==null?0:m.homeScore)+'-'+(m.awayScore==null?0:m.awayScore)+
        '</span><span>'+esc(m.away)+'</span>';
    else if(m.status==='scheduled') s='<span class="bt">'+esc(m.time||'')+'</span><span>'+esc(m.home)+' – '+esc(m.away)+'</span>';
    else s='<span>'+esc(m.home)+'</span><span class="bs">'+(m.homeScore==null?'-':m.homeScore)+'-'+
        (m.awayScore==null?'-':m.awayScore)+'</span><span>'+esc(m.away)+'</span>';
    return '<span class="it">'+s+'</span>';
  }
  // Costruisce lo scroll: il nome del campionato compare UNA volta a inizio gruppo,
  // poi tutte le sue partite senza ripetere l'etichetta.
  function buildBar(list){
    var out=[], last=null;
    for(var j=0;j<list.length;j++){
      var it=list[j];
      if(it.c!==last){
        var bfl=it.flag?'<img class="bfl" src="'+esc(it.flag)+'" alt="" onerror="this.remove()">':'';
        out.push('<span class="bc">'+bfl+esc(it.c)+'</span>'); last=it.c;
      }
      else { out.push('<span class="bsep">•</span>'); }   // separatore tra partite dello stesso campionato
      out.push(barItem(it));
    }
    return out.join('');
  }

  function enter(el){ setTimeout(function(){ el.classList.add('on'); }, 30); }
  function clearCur(){
    if(cur){ var old=cur; cur=null; old.classList.remove('on'); old.classList.add('out');
             setTimeout(function(){ if(old.parentNode) old.parentNode.removeChild(old); },400); }
  }
  function showCard(){
    if(!SEQ.length){ placeholder(); return; }
    if(i>=SEQ.length) i=0;
    var it=SEQ[i]; i=(i+1)%SEQ.length;
    var el, isSum=(it.kind==='summary');
    el = isSum ? summaryCard(it) : card(it);
    lane.appendChild(el);
    if(isSum) fitSummary(el); else fit(el);
    clearCur(); cur=el; enter(el);
  }
  function placeholder(){
    var el=document.createElement('div'); el.className='card';
    el.innerHTML='<div class="hdr"><span class="cl">CALCIO OGGI</span><span class="dt">'+todayStr()+'</span></div>'+
      '<div class="row"><div></div><div class="mid"><span class="stat gray">IN ATTESA DATI</span></div><div></div></div>';
    lane.appendChild(el); clearCur(); cur=el; enter(el);
  }
  function adPhase(){
    if(!ADS.length || !LIST.length){ step(); return; }
    var ad=document.createElement('div'); ad.className='ad';
    ad.innerHTML = ADS.map(function(a){
      return '<div class="sl '+a.fx+'" style="background-image:url('+esc(a.url)+')"></div>';
    }).join('');
    var bar=document.createElement('div'); bar.className='bar';
    var half=buildBar(LIST);
    bar.innerHTML='<div class="trk">'+half+half+'</div>';
    lane.appendChild(ad); lane.appendChild(bar);
    clearCur();
    // Velocità COSTANTE (px/sec) indipendente dal numero di partite: la durata si
    // calcola dalla larghezza reale del contenuto. barDur (backend) regola la velocità
    // (più basso = più veloce). La ripresa usa la durata effettiva.
    var trk=bar.querySelector('.trk');
    var halfW = (trk.scrollWidth/2) || 1;          // larghezza di una copia (px)
    var pxPerSec = 4500 / (CFG.barDur || 24);      // velocità costante (px/sec)
    var dur = halfW / pxPerSec;                     // secondi per un giro
    trk.style.animationDuration = dur + 's';
    trk.style.animationDelay = '-' + (barOffset % dur) + 's';
    var barStart=Date.now(), barClosed=false;
    function closeBar(){ if(!barClosed){ barClosed=true; barOffset += (Date.now()-barStart)/1000; } }
    var slides=ad.querySelectorAll('.sl'), k=0;
    setTimeout(function(){
      ad.classList.add('on'); bar.classList.add('on'); if(slides[0]) slides[0].classList.add('on');
    }, 30);
    function secOf(idx){ return ((ADS[idx] && ADS[idx].seconds) || CFG.adSlide) * 1000; }
    function next(){
      slides[k].classList.remove('on'); slides[k].classList.add('out'); k++;
      if(k<slides.length){ slides[k].classList.add('on'); setTimeout(next, secOf(k)); }
      else {
        closeBar();                          // memorizza dove si e' fermato lo scorrimento
        ad.classList.remove('on'); bar.classList.remove('on');
        setTimeout(function(){ if(ad.parentNode)ad.remove(); if(bar.parentNode)bar.remove(); step(); }, 480);
      }
    }
    if(slides.length) setTimeout(next, secOf(0)); else { setTimeout(function(){ad.remove();bar.remove();step();}, 400); }
  }
  function step(){
    if(shown>0 && shown % CFG.adEvery === 0 && ADS.length){ shown++; adPhase(); return; }
    showCard(); shown++;
    setTimeout(step, CFG.hold*1000);
  }

  // ---- Dati ----
  function fmtUpdated(iso, stale){
    if(iso){ var d=new Date(iso); foot.textContent='agg. '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2); }
    foot.className = stale ? 'stale' : '';
  }
  function anyLive(){ return LIST.some(function(x){return x.m.status==='live';}); }

  var dataTimer=null;
  function startOnce(){ if(!started){ started=true; (document.fonts?document.fonts.ready:Promise.resolve()).then(step); } }
  function loadData(){
    fetch('api/calcio.json'+DEMO,{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){
      LIST = flatten(data);
      SEQ = buildSequence(LIST);
      fmtUpdated(data.updated, data.stale);
      startOnce();
      if(dataTimer) clearTimeout(dataTimer);
      dataTimer=setTimeout(loadData, anyLive()?60000:120000);   // live 60s, altrimenti 2 min
    }).catch(function(){
      if(foot.textContent) foot.className='stale';
      startOnce();
      if(dataTimer) clearTimeout(dataTimer);
      dataTimer=setTimeout(loadData, 15000);
    });
  }
  function loadAds(){
    fetch('api/ads.json',{cache:'no-store'}).then(function(r){return r.json();}).then(function(d){
      applyCfg(d.config);
      ADS = (d.ads||[]).map(function(a){ return {url:a.url, fx:a.fx||'fx-right', seconds:a.seconds||CFG.adSlide}; });
    }).catch(function(){ applyCfg(null); });
    setTimeout(loadAds, 120000);   // ricontrolla impostazioni e pubblicita' ogni 2 min
  }

  applyCfg(null);   // default finche' non arriva ads.json
  loadAds();
  loadData();

  // Ricarica completa ogni 6 ore per liberare memoria del player.
  setTimeout(function(){ location.reload(); }, 6*60*60*1000);
})();
</script>
</body>
</html>
