<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=320, height=200, initial-scale=1, user-scalable=no">
<title>Ledwall Calcio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@500&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:320px;height:200px;overflow:hidden;background:#000;}
  body{font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif;color:#fff;
       -webkit-font-smoothing:none;text-rendering:optimizeSpeed;}
  #tk{height:100vh;width:100vw;display:flex;flex-direction:column;background:#0b1e2c;overflow:hidden;}
  .lane{flex:1;position:relative;overflow:hidden;display:block;}

  /* ---- Scheda partita (una alla volta, stile tabellone) ---- */
  .card{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1.1fr 1fr;align-items:center;
        padding:0 2%;color:#fff;opacity:0;transform:translateY(25%);
        transition:opacity .35s,transform .35s;}
  .card.on{opacity:1;transform:none;}
  .card.out{opacity:0;transform:translateY(-25%);}
  .team{display:flex;flex-direction:column;align-items:center;gap:0.28em;min-width:0;}
  .badge{width:calc(100vh * 0.42);height:calc(100vh * 0.42);border-radius:50%;background:#fff;
         display:flex;align-items:center;justify-content:center;overflow:hidden;}
  .badge img{width:84%;height:84%;object-fit:contain;}
  .badge i{font-style:normal;width:100%;height:100%;display:flex;align-items:center;justify-content:center;
           font-size:calc(100vh * 0.13);font-weight:800;color:#fff;letter-spacing:0.02em;}
  .team .nm{font-size:calc(100vh * 0.13);font-weight:700;white-space:nowrap;max-width:100%;
            overflow:hidden;text-overflow:ellipsis;}
  .team .nm.win{color:#ffd200;}
  .mid{display:flex;flex-direction:column;align-items:center;gap:0.18em;text-align:center;}
  .mid .cl{font-size:calc(100vh * 0.095);font-weight:800;color:#ffd200;letter-spacing:0.05em;}
  .mid .dt{font-size:calc(100vh * 0.085);color:#b8c3cc;font-weight:600;font-variant-numeric:tabular-nums;}
  .mid .big{font-size:calc(100vh * 0.32);font-weight:800;line-height:0.95;
            font-variant-numeric:tabular-nums;letter-spacing:0.02em;}
  .mid .big.time{font-size:calc(100vh * 0.24);color:#2b7bff;}
  .mid .stat{font-size:calc(100vh * 0.10);font-weight:800;color:#e5202f;letter-spacing:0.05em;}
  .mid .stat.live{animation:blink 1.2s steps(2,start) infinite;}
  .mid .stat.gray{color:#b8c3cc;}

  /* ---- Intermezzo pubblicitario: risultati in basso, immagine sopra ---- */
  .ad{position:absolute;left:0;right:0;top:0;bottom:calc(100vh * 0.24);overflow:hidden;background:#000;
      transform:translateY(-105%);transition:transform .45s cubic-bezier(.2,.8,.2,1);}
  .ad.on{transform:none;}
  .ad .sl{position:absolute;inset:0;background-size:cover;background-position:center;background-repeat:no-repeat;
          opacity:0;transition:opacity .5s,transform .5s cubic-bezier(.2,.8,.2,1);}
  .ad .sl.on{opacity:1;transform:none;}
  .ad .sl.fx-right{transform:translateX(60%);}   .ad .sl.fx-right.out{transform:translateX(-60%);opacity:0;}
  .ad .sl.fx-zoom{transform:scale(0.6);}          .ad .sl.fx-zoom.out{transform:scale(1.3);opacity:0;}
  .ad .sl.fx-up{transform:translateY(60%);}       .ad .sl.fx-up.out{transform:translateY(-60%);opacity:0;}
  .bar{position:absolute;left:0;right:0;bottom:0;height:calc(100vh * 0.24);display:flex;align-items:center;
       overflow:hidden;background:#0b1e2c;border-top:0.1em solid #ffd200;color:#fff;
       font-size:calc(100vh * 0.11);font-weight:700;white-space:nowrap;
       transform:translateY(105%);transition:transform .45s cubic-bezier(.2,.8,.2,1);}
  .bar.on{transform:none;}
  .bar .trk{display:inline-flex;align-items:center;gap:0.9em;padding-left:100vw;will-change:transform;
            animation:barscroll linear infinite;animation-duration:40s;}
  @keyframes barscroll{from{transform:translateX(0);}to{transform:translateX(-50%);}}
  .bar .it{display:inline-flex;align-items:center;gap:0.3em;}
  .bar .bs{background:#fff;color:#000;padding:0 0.3em;border-radius:0.12em;font-weight:800;font-variant-numeric:tabular-nums;}
  .bar .bt{background:#2b7bff;color:#fff;padding:0 0.3em;border-radius:0.12em;font-weight:800;font-variant-numeric:tabular-nums;}
  .bar .bl{color:#e5202f;font-weight:800;font-size:0.85em;animation:blink 1.2s steps(2,start) infinite;}
  .bar .bc{color:#ffd200;font-size:0.8em;margin-right:0.2em;}

  @keyframes blink{to{opacity:0.45;}}

  /* Meta: ora ultimo aggiornamento */
  #foot{position:absolute;right:3px;bottom:1px;z-index:6;font-size:12px;color:#3a4a55;font-weight:600;}
  #foot.stale{color:#e5202f;}
</style>
</head>
<body>
<div id="tk"><div class="lane" id="lane"></div><div id="foot"></div></div>

<script>
(function(){
  "use strict";
  var qs = new URLSearchParams(location.search);
  var DEMO   = qs.get('demo') ? ('?demo=' + qs.get('demo')) : '';
  var HOLD   = (parseFloat(qs.get('hold'))   || 5) * 1000;   // secondi per scheda
  var ADEVERY= parseInt(qs.get('adEvery'))   || 4;           // pubblicita' ogni N schede
  var ADSLIDE= (parseFloat(qs.get('adSlide'))|| 5) * 1000;   // secondi per immagine promo

  var lane = document.getElementById('lane');
  var foot = document.getElementById('foot');
  var esc = function(s){ return String(s==null?'':s)
     .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); };

  var LIST = [];     // partite appiattite: {c, m}
  var ADS  = [];     // url immagini pubblicitarie
  var i = 0, cur = null, shown = 0, started = false;
  var fx = ['fx-right','fx-zoom','fx-up'];

  // Attiva la transizione d'ingresso al tick successivo (non usa rAF: alcuni webview
  // integrati lo congelano quando non a fuoco, lasciando gli elementi invisibili).
  function enter(el){ setTimeout(function(){ el.classList.add('on'); }, 30); }

  function order(st){ return st==='live'?0 : st==='scheduled'?1 : 2; }

  function flatten(data){
    var out = [];
    (data.competitions||[]).forEach(function(c){
      (c.matches||[]).slice().sort(function(a,b){return order(a.status)-order(b.status);})
        .forEach(function(m){ out.push({c:c.shortName||c.name, m:m}); });
    });
    return out;
  }

  function initials(n){
    return (n||'').split(/\s+/).map(function(w){return w[0]||'';}).join('').slice(0,3).toUpperCase();
  }
  function badge(name, logo){
    if(logo){
      return '<span class="badge"><img src="'+esc(logo)+'" alt="" '+
             'onerror="this.parentNode.innerHTML=\'<i>'+esc(initials(name))+'</i>\'"></span>';
    }
    return '<span class="badge"><i>'+esc(initials(name))+'</i></span>';
  }
  function team(name, logo, win){
    return '<div class="team">'+badge(name,logo)+
           '<span class="nm'+(win?' win':'')+'">'+esc(name)+'</span></div>';
  }

  function todayStr(){ return new Date().toLocaleDateString('it-IT',{day:'2-digit',month:'2-digit',year:'numeric'}); }
  function liveLabel(min){ return (min && min!=='LIVE') ? esc(min)+"'" : 'LIVE'; }

  function card(it){
    var m=it.m, hw=false, aw=false, mid, cl='<span class="cl">'+esc(it.c)+'</span>';
    var dt = '<span class="dt">'+esc(m.date||todayStr())+'</span>';
    if(m.status==='live'){
      mid = cl+dt+'<span class="big">'+(m.homeScore==null?0:m.homeScore)+'-'+(m.awayScore==null?0:m.awayScore)+
            '</span><span class="stat live">'+liveLabel(m.minute)+'</span>';
    } else if(m.status==='scheduled'){
      mid = cl+dt+'<span class="big time">'+esc(m.time||'')+'</span><span class="stat gray">OGGI</span>';
    } else {
      hw = (m.homeScore!=null && m.awayScore!=null && m.homeScore>m.awayScore);
      aw = (m.homeScore!=null && m.awayScore!=null && m.awayScore>m.homeScore);
      mid = cl+dt+'<span class="big">'+(m.homeScore==null?'-':m.homeScore)+'-'+(m.awayScore==null?'-':m.awayScore)+
            '</span><span class="stat">FINALE</span>';
    }
    var el=document.createElement('div'); el.className='card';
    el.innerHTML = team(m.home,m.homeLogo,hw)+'<div class="mid">'+mid+'</div>'+team(m.away,m.awayLogo,aw);
    return el;
  }
  function fit(el){   // rimpicciolisce i nomi lunghi finche' stanno nella colonna
    el.querySelectorAll('.nm').forEach(function(nm){
      var fs=parseFloat(getComputedStyle(nm).fontSize), n=0;
      while(nm.scrollWidth>nm.clientWidth && n<12){ fs*=0.9; nm.style.fontSize=fs+'px'; n++; }
    });
  }

  function barItem(it){
    var m=it.m, s;
    if(m.status==='live') s='<span class="bl">LIVE '+liveLabel(m.minute)+'</span><span>'+esc(m.home)+
        '</span><span class="bs">'+(m.homeScore==null?0:m.homeScore)+'-'+(m.awayScore==null?0:m.awayScore)+
        '</span><span>'+esc(m.away)+'</span>';
    else if(m.status==='scheduled') s='<span class="bt">'+esc(m.time||'')+'</span><span>'+esc(m.home)+' – '+esc(m.away)+'</span>';
    else s='<span>'+esc(m.home)+'</span><span class="bs">'+(m.homeScore==null?'-':m.homeScore)+'-'+
        (m.awayScore==null?'-':m.awayScore)+'</span><span>'+esc(m.away)+'</span>';
    return '<span class="it"><span class="bc">'+esc(it.c)+'</span>'+s+'</span>';
  }

  function clearCur(){
    if(cur){ var old=cur; cur=null; old.classList.remove('on'); old.classList.add('out');
             setTimeout(function(){ if(old.parentNode) old.parentNode.removeChild(old); },400); }
  }

  function showCard(){
    if(!LIST.length){ placeholder(); return; }
    if(i>=LIST.length) i=0;
    var it=LIST[i]; i=(i+1)%LIST.length;
    var el=card(it); lane.appendChild(el); fit(el);
    clearCur(); cur=el;
    enter(el);
  }

  function placeholder(){
    var el=document.createElement('div'); el.className='card';
    el.innerHTML='<div></div><div class="mid"><span class="cl">CALCIO OGGI</span>'+
      '<span class="dt">'+todayStr()+'</span><span class="stat gray">IN ATTESA DATI</span></div><div></div>';
    lane.appendChild(el); clearCur(); cur=el;
    enter(el);
  }

  function adPhase(){
    if(!ADS.length || !LIST.length){ step(); return; }   // niente pubblicita': continua con le schede
    var ad=document.createElement('div'); ad.className='ad';
    ad.innerHTML = ADS.map(function(u,k){
      return '<div class="sl '+fx[k%fx.length]+'" style="background-image:url('+esc(u)+')"></div>';
    }).join('');
    var bar=document.createElement('div'); bar.className='bar';
    var half=LIST.map(barItem).join('');
    bar.innerHTML='<div class="trk">'+half+half+'</div>';
    lane.appendChild(ad); lane.appendChild(bar);
    clearCur();
    var slides=ad.querySelectorAll('.sl'), k=0;
    setTimeout(function(){
      ad.classList.add('on'); bar.classList.add('on'); if(slides[0]) slides[0].classList.add('on');
    }, 30);
    function next(){
      slides[k].classList.remove('on'); slides[k].classList.add('out'); k++;
      if(k<slides.length){ slides[k].classList.add('on'); setTimeout(next, ADSLIDE); }
      else {
        ad.classList.remove('on'); bar.classList.remove('on');
        setTimeout(function(){ if(ad.parentNode)ad.remove(); if(bar.parentNode)bar.remove(); step(); }, 480);
      }
    }
    if(slides.length) setTimeout(next, ADSLIDE); else { setTimeout(function(){ad.remove();bar.remove();step();}, 400); }
  }

  function step(){
    if(shown>0 && shown % ADEVERY === 0 && ADS.length){ shown++; adPhase(); return; }
    showCard(); shown++;
    setTimeout(step, HOLD);
  }

  // ---- Dati ----
  function fmtUpdated(iso, stale){
    if(iso){ var d=new Date(iso); foot.textContent='agg. '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2); }
    foot.className = stale ? 'stale' : '';
  }
  function anyLive(){ return LIST.some(function(x){return x.m.status==='live';}); }

  var dataTimer=null;
  function loadData(){
    fetch('api/calcio.json'+DEMO,{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){
      LIST = flatten(data);
      fmtUpdated(data.updated, data.stale);
      if(!started && (LIST.length || true)){ started=true; (document.fonts?document.fonts.ready:Promise.resolve()).then(step); }
      if(dataTimer) clearTimeout(dataTimer);
      dataTimer=setTimeout(loadData, anyLive()?60000:600000);
    }).catch(function(){
      if(foot.textContent) foot.className='stale';
      if(!started){ started=true; step(); }        // parte comunque col placeholder
      if(dataTimer) clearTimeout(dataTimer);
      dataTimer=setTimeout(loadData, 15000);
    });
  }
  function loadAds(){
    fetch('api/ads.json'+ (DEMO?('&'+DEMO.slice(1)):''),{cache:'no-store'})
      .then(function(r){return r.json();}).then(function(d){
        ADS = (d.ads||[]).map(function(a){return a.url;});
      }).catch(function(){ /* mantieni le precedenti */ });
    setTimeout(loadAds, 300000);   // ricontrolla le pubblicita' ogni 5 min
  }

  loadAds();
  loadData();

  // Ricarica completa ogni 6 ore per liberare memoria del player.
  setTimeout(function(){ location.reload(); }, 6*60*60*1000);
})();
</script>
</body>
</html>
