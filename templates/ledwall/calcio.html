<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=320, height=200, initial-scale=1, user-scalable=no">
<title>Ledwall Calcio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@500&display=swap" rel="stylesheet">
<style>
  /* Dimensioni del ledwall. Per un formato diverso (es. 384x960) cambiare SOLO --w/--h. */
  :root{--w:320px; --h:200px;}
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:var(--w);height:var(--h);overflow:hidden;background:#000;}
  body{font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif;color:#fff;
       -webkit-font-smoothing:none;text-rendering:optimizeSpeed;}
  #tk{width:var(--w);height:var(--h);display:flex;flex-direction:column;background:#0b1e2c;overflow:hidden;position:relative;}
  .lane{flex:1;position:relative;overflow:hidden;display:block;}

  /* ---- Scheda partita (una alla volta, stile tabellone) ---- */
  /* Intestazione centrata (competizione + data) sopra, riga logo-punteggio-logo sotto,
     il tutto centrato verticalmente: distribuzione bilanciata. */
  .card{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;
        gap:calc(var(--h) * 0.025);padding:calc(var(--h) * 0.04) 3%;color:#fff;
        opacity:0;transform:translateY(25%);transition:opacity .35s,transform .35s;}
  .card.on{opacity:1;transform:none;}
  .card.out{opacity:0;transform:translateY(-25%);}
  .hdr{display:flex;flex-direction:column;align-items:center;line-height:1;gap:calc(var(--h) * 0.012);}
  .hdr .cl{font-size:calc(var(--h) * 0.095);font-weight:800;color:#ffd200;letter-spacing:0.05em;text-align:center;}
  .hdr .dt{font-size:calc(var(--h) * 0.075);color:#b8c3cc;font-weight:600;font-variant-numeric:tabular-nums;}
  .row{display:grid;grid-template-columns:1fr 1.15fr 1fr;align-items:center;}
  .team{display:flex;flex-direction:column;align-items:center;gap:0.2em;min-width:0;}
  .badge{width:calc(var(--h) * 0.32);height:calc(var(--h) * 0.32);border-radius:50%;background:#fff;
         display:flex;align-items:center;justify-content:center;overflow:hidden;}
  /* I loghi di diretta.it sono 30x30: non ingrandirli oltre il nativo (restano nitidi). */
  .badge img{max-width:78%;max-height:78%;width:auto;height:auto;object-fit:contain;image-rendering:auto;}
  .badge i{font-style:normal;width:100%;height:100%;display:flex;align-items:center;justify-content:center;
           font-size:calc(var(--h) * 0.12);font-weight:800;color:#111;letter-spacing:0.02em;}
  .team .nm{font-size:calc(var(--h) * 0.12);font-weight:700;white-space:nowrap;max-width:100%;
            overflow:hidden;text-overflow:ellipsis;text-align:center;}
  .team .nm.win{color:#ffd200;}
  .mid{display:flex;flex-direction:column;align-items:center;gap:0.02em;text-align:center;}
  .mid .big{font-size:calc(var(--h) * 0.34);font-weight:800;line-height:0.95;
            font-variant-numeric:tabular-nums;letter-spacing:0.02em;}
  .mid .big.time{font-size:calc(var(--h) * 0.24);color:#2b7bff;}
  .mid .stat{font-size:calc(var(--h) * 0.11);font-weight:800;color:#e5202f;letter-spacing:0.05em;}
  .mid .stat.live{animation:blink 1.2s steps(2,start) infinite;}
  .mid .stat.gray{color:#b8c3cc;}

  /* ---- Intermezzo pubblicitario: risultati in basso, immagine sopra ---- */
  .ad{position:absolute;left:0;right:0;top:0;bottom:calc(var(--h) * 0.24);overflow:hidden;background:#000;
      transform:translateY(-105%);transition:transform .45s cubic-bezier(.2,.8,.2,1);}
  .ad.on{transform:none;}
  .ad .sl{position:absolute;inset:0;background-size:cover;background-position:center;background-repeat:no-repeat;
          opacity:0;transition:opacity .5s,transform .5s cubic-bezier(.2,.8,.2,1);}
  .ad .sl.on{opacity:1;transform:none;}
  .ad .sl.fx-right{transform:translateX(60%);}   .ad .sl.fx-right.out{transform:translateX(-60%);opacity:0;}
  .ad .sl.fx-zoom{transform:scale(0.6);}          .ad .sl.fx-zoom.out{transform:scale(1.3);opacity:0;}
  .ad .sl.fx-up{transform:translateY(60%);}       .ad .sl.fx-up.out{transform:translateY(-60%);opacity:0;}
  .ad .sl.fx-fade{transform:none;}                .ad .sl.fx-fade.out{transform:none;opacity:0;}
  .bar{position:absolute;left:0;right:0;bottom:0;height:calc(var(--h) * 0.24);display:flex;align-items:center;
       overflow:hidden;background:#0b1e2c;border-top:0.1em solid #ffd200;color:#fff;
       font-size:calc(var(--h) * 0.11);font-weight:700;white-space:nowrap;
       transform:translateY(105%);transition:transform .45s cubic-bezier(.2,.8,.2,1);}
  .bar.on{transform:none;}
  .bar .trk{display:inline-flex;align-items:center;gap:0.9em;padding-left:var(--w);will-change:transform;
            animation:barscroll linear infinite;animation-duration:40s;}
  @keyframes barscroll{from{transform:translateX(0);}to{transform:translateX(-50%);}}
  .bar .it{display:inline-flex;align-items:center;gap:0.3em;}
  .bar .bs{background:#fff;color:#000;padding:0 0.3em;border-radius:0.12em;font-weight:800;font-variant-numeric:tabular-nums;}
  .bar .bt{background:#2b7bff;color:#fff;padding:0 0.3em;border-radius:0.12em;font-weight:800;font-variant-numeric:tabular-nums;}
  .bar .bl{color:#e5202f;font-weight:800;font-size:0.85em;animation:blink 1.2s steps(2,start) infinite;}
  .bar .bc{color:#ffd200;font-size:0.8em;margin-right:0.2em;}

  @keyframes blink{to{opacity:0.45;}}

  /* Meta: ora ultimo aggiornamento */
  #foot{position:absolute;right:3px;bottom:1px;z-index:6;font-size:12px;color:#3a4a55;font-weight:600;}
  #foot.stale{color:#e5202f;}
</style>
</head>
<body>
<div id="tk"><div class="lane" id="lane"></div><div id="foot"></div></div>

<script>
(function(){
  "use strict";
  var qs = new URLSearchParams(location.search);
  var DEMO = qs.get('demo') ? ('?demo=' + qs.get('demo')) : '';
  // Override facoltativi via query (per test); la configurazione vera sta nel backend admin.
  var Q = {
    hold:    parseFloat(qs.get('hold'))    || null,
    adEvery: parseInt(qs.get('adEvery'))   || null,
    adSlide: parseFloat(qs.get('adSlide')) || null
  };

  var lane = document.getElementById('lane');
  var foot = document.getElementById('foot');
  var esc = function(s){ return String(s==null?'':s)
     .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); };

  var LIST = [];    // partite appiattite: {c, m}
  var ADS  = [];    // {url, fx, seconds}
  var CFG  = {hold:5, adEvery:4, adSlide:5};   // impostazioni dal backend (default di sicurezza)
  var i = 0, cur = null, shown = 0, started = false;

  function applyCfg(c){
    c = c || {};
    CFG.hold    = Q.hold    || c.hold    || 5;
    CFG.adEvery = Q.adEvery || c.adEvery || 4;
    CFG.adSlide = Q.adSlide || c.adSlide || 5;
  }

  function order(st){ return st==='live'?0 : st==='scheduled'?1 : 2; }
  function flatten(data){
    var out = [];
    (data.competitions||[]).forEach(function(c){
      (c.matches||[]).slice().sort(function(a,b){return order(a.status)-order(b.status);})
        .forEach(function(m){ out.push({c:c.shortName||c.name, m:m}); });
    });
    return out;
  }
  function initials(n){
    return (n||'').split(/\s+/).map(function(w){return w[0]||'';}).join('').slice(0,3).toUpperCase();
  }
  function badge(name, logo){
    if(logo){
      return '<span class="badge"><img src="'+esc(logo)+'" alt="" '+
             'onerror="this.parentNode.innerHTML=\'<i>'+esc(initials(name))+'</i>\'"></span>';
    }
    return '<span class="badge"><i>'+esc(initials(name))+'</i></span>';
  }
  function team(name, logo, win){
    return '<div class="team">'+badge(name,logo)+
           '<span class="nm'+(win?' win':'')+'">'+esc(name)+'</span></div>';
  }
  function todayStr(){ return new Date().toLocaleDateString('it-IT',{day:'2-digit',month:'2-digit',year:'numeric'}); }
  function isMin(m){ return /^\d+$/.test(m); }
  function cardStat(m){ if(isMin(m)) return m+"'"; if(m==='INT') return 'INTERVALLO'; return 'LIVE'; }
  function barLive(m){ if(m==='INT') return 'INT'; if(isMin(m)) return "LIVE "+m+"'"; return 'LIVE'; }

  function card(it){
    var m=it.m, hw=false, aw=false, big, stat;
    if(m.status==='live'){
      var stCls = (m.minute==='INT') ? 'stat' : 'stat live';
      big='<span class="big">'+(m.homeScore==null?0:m.homeScore)+'-'+(m.awayScore==null?0:m.awayScore)+'</span>';
      stat='<span class="'+stCls+'">'+cardStat(m.minute)+'</span>';
    } else if(m.status==='scheduled'){
      big='<span class="big time">'+esc(m.time||'')+'</span>';
      stat='<span class="stat gray">'+(m.date?'DOMANI':'OGGI')+'</span>';
    } else {
      hw = (m.homeScore!=null && m.awayScore!=null && m.homeScore>m.awayScore);
      aw = (m.homeScore!=null && m.awayScore!=null && m.awayScore>m.homeScore);
      big='<span class="big">'+(m.homeScore==null?'-':m.homeScore)+'-'+(m.awayScore==null?'-':m.awayScore)+'</span>';
      stat='<span class="stat">FINALE</span>';
    }
    var hdr='<div class="hdr"><span class="cl">'+esc(it.c)+'</span><span class="dt">'+esc(m.date||todayStr())+'</span></div>';
    var row='<div class="row">'+team(m.home,m.homeLogo,hw)+'<div class="mid">'+big+stat+'</div>'+team(m.away,m.awayLogo,aw)+'</div>';
    var el=document.createElement('div'); el.className='card';
    el.innerHTML = hdr+row;
    return el;
  }
  function fit(el){
    el.querySelectorAll('.nm').forEach(function(nm){
      var fs=parseFloat(getComputedStyle(nm).fontSize), n=0;
      while(nm.scrollWidth>nm.clientWidth && n<12){ fs*=0.9; nm.style.fontSize=fs+'px'; n++; }
    });
  }
  function barItem(it){
    var m=it.m, s;
    if(m.status==='live') s='<span class="bl">'+barLive(m.minute)+'</span><span>'+esc(m.home)+
        '</span><span class="bs">'+(m.homeScore==null?0:m.homeScore)+'-'+(m.awayScore==null?0:m.awayScore)+
        '</span><span>'+esc(m.away)+'</span>';
    else if(m.status==='scheduled') s='<span class="bt">'+esc(m.time||'')+'</span><span>'+esc(m.home)+' – '+esc(m.away)+'</span>';
    else s='<span>'+esc(m.home)+'</span><span class="bs">'+(m.homeScore==null?'-':m.homeScore)+'-'+
        (m.awayScore==null?'-':m.awayScore)+'</span><span>'+esc(m.away)+'</span>';
    return '<span class="it"><span class="bc">'+esc(it.c)+'</span>'+s+'</span>';
  }

  function enter(el){ setTimeout(function(){ el.classList.add('on'); }, 30); }
  function clearCur(){
    if(cur){ var old=cur; cur=null; old.classList.remove('on'); old.classList.add('out');
             setTimeout(function(){ if(old.parentNode) old.parentNode.removeChild(old); },400); }
  }
  function showCard(){
    if(!LIST.length){ placeholder(); return; }
    if(i>=LIST.length) i=0;
    var it=LIST[i]; i=(i+1)%LIST.length;
    var el=card(it); lane.appendChild(el); fit(el);
    clearCur(); cur=el; enter(el);
  }
  function placeholder(){
    var el=document.createElement('div'); el.className='card';
    el.innerHTML='<div class="hdr"><span class="cl">CALCIO OGGI</span><span class="dt">'+todayStr()+'</span></div>'+
      '<div class="row"><div></div><div class="mid"><span class="stat gray">IN ATTESA DATI</span></div><div></div></div>';
    lane.appendChild(el); clearCur(); cur=el; enter(el);
  }
  function adPhase(){
    if(!ADS.length || !LIST.length){ step(); return; }
    var ad=document.createElement('div'); ad.className='ad';
    ad.innerHTML = ADS.map(function(a){
      return '<div class="sl '+a.fx+'" style="background-image:url('+esc(a.url)+')"></div>';
    }).join('');
    var bar=document.createElement('div'); bar.className='bar';
    var half=LIST.map(barItem).join('');
    bar.innerHTML='<div class="trk">'+half+half+'</div>';
    lane.appendChild(ad); lane.appendChild(bar);
    clearCur();
    var slides=ad.querySelectorAll('.sl'), k=0;
    setTimeout(function(){
      ad.classList.add('on'); bar.classList.add('on'); if(slides[0]) slides[0].classList.add('on');
    }, 30);
    function secOf(idx){ return ((ADS[idx] && ADS[idx].seconds) || CFG.adSlide) * 1000; }
    function next(){
      slides[k].classList.remove('on'); slides[k].classList.add('out'); k++;
      if(k<slides.length){ slides[k].classList.add('on'); setTimeout(next, secOf(k)); }
      else {
        ad.classList.remove('on'); bar.classList.remove('on');
        setTimeout(function(){ if(ad.parentNode)ad.remove(); if(bar.parentNode)bar.remove(); step(); }, 480);
      }
    }
    if(slides.length) setTimeout(next, secOf(0)); else { setTimeout(function(){ad.remove();bar.remove();step();}, 400); }
  }
  function step(){
    if(shown>0 && shown % CFG.adEvery === 0 && ADS.length){ shown++; adPhase(); return; }
    showCard(); shown++;
    setTimeout(step, CFG.hold*1000);
  }

  // ---- Dati ----
  function fmtUpdated(iso, stale){
    if(iso){ var d=new Date(iso); foot.textContent='agg. '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2); }
    foot.className = stale ? 'stale' : '';
  }
  function anyLive(){ return LIST.some(function(x){return x.m.status==='live';}); }

  var dataTimer=null;
  function startOnce(){ if(!started){ started=true; (document.fonts?document.fonts.ready:Promise.resolve()).then(step); } }
  function loadData(){
    fetch('api/calcio.json'+DEMO,{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){
      LIST = flatten(data);
      fmtUpdated(data.updated, data.stale);
      startOnce();
      if(dataTimer) clearTimeout(dataTimer);
      dataTimer=setTimeout(loadData, anyLive()?60000:600000);
    }).catch(function(){
      if(foot.textContent) foot.className='stale';
      startOnce();
      if(dataTimer) clearTimeout(dataTimer);
      dataTimer=setTimeout(loadData, 15000);
    });
  }
  function loadAds(){
    fetch('api/ads.json',{cache:'no-store'}).then(function(r){return r.json();}).then(function(d){
      applyCfg(d.config);
      ADS = (d.ads||[]).map(function(a){ return {url:a.url, fx:a.fx||'fx-right', seconds:a.seconds||CFG.adSlide}; });
    }).catch(function(){ applyCfg(null); });
    setTimeout(loadAds, 300000);   // ricontrolla impostazioni e pubblicita' ogni 5 min
  }

  applyCfg(null);   // default finche' non arriva ads.json
  loadAds();
  loadData();

  // Ricarica completa ogni 6 ore per liberare memoria del player.
  setTimeout(function(){ location.reload(); }, 6*60*60*1000);
})();
</script>
</body>
</html>
