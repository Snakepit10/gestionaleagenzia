<tr class="riga-estratto {% if r.stato == 'ignorato' %}riga-ignorata{% elif r.stato == 'classificato' %}riga-classificata{% endif %}">
    <td>{% if r.data %}{{ r.data|date:"d/m/Y" }}{% else %}—{% endif %}</td>
    <td class="small">{{ r.descrizione }}</td>
    <td class="text-end {% if r.importo < 0 %}text-danger{% else %}text-success{% endif %}">{{ r.importo|floatformat:2 }} €</td>
    <td>
        {% if r.importo < 0 %}
        <select name="cat_{{ r.pk }}" class="form-select form-select-sm">
            <option value="">— Categoria costo —</option>
            {% for c in categorie %}
            <option value="{{ c.codice }}" {% if c.codice == r.categoria_codice %}selected{% endif %}>{{ c.nome }}</option>
            {% endfor %}
        </select>
        {% else %}
        <select name="prod_{{ r.pk }}" class="form-select form-select-sm">
            <option value="">— Prodotto ricavo —</option>
            {% for p in prodotti %}
            <option value="{{ p.codice }}" {% if p.codice == r.prodotto_codice %}selected{% endif %}>{{ p.nome }}</option>
            {% endfor %}
        </select>
        {% endif %}
    </td>
    {% if is_super %}{% for cell in r.alloc_cells %}
    <td><input type="text" inputmode="decimal" name="perc_{{ r.pk }}_{{ cell.db }}" value="{{ cell.perc }}"
               class="form-control form-control-sm text-end perc-input" data-row="{{ r.pk }}" placeholder="0" style="min-width:60px;"></td>
    {% endfor %}{% endif %}
    <td class="text-center">
        <div class="form-check form-switch d-inline-block">
            <input type="hidden" name="stato_{{ r.pk }}" value="ignora">
            <input class="form-check-input" type="checkbox" name="stato_{{ r.pk }}" value="includi"
                   {% if r.stato != 'ignorato' %}checked{% endif %}>
        </div>
    </td>
</tr>
